# XcodeGen project definition for the MoqomRoom sample.
#
#   brew install xcodegen
#   cd Samples/MoqomRoom && xcodegen generate && open MoqomRoom.xcodeproj
#
# Needs Xcode 26 with the iOS 26 SDK. Relay and join-service endpoints are build
# settings (see Signing.xcconfig and Local.xcconfig.example), not source edits.

name: MoqomRoom

options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

packages:
  MoqomKit:
    # The repository root. Swap for a versioned dependency in your own app:
    #   url: https://github.com/moqom-cloud/moqom-swift
    #   from: 0.1.0
    path: ../..

targets:
  MoqomRoom:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - MoqomRoomTests
        - MoqomRoomUITests
    sources:
      - path: MoqomRoom/Sources
    dependencies:
      - package: MoqomKit
        product: MoqomKit
      - package: MoqomKit
        product: MoqomLoopback
      - target: MoqomRoomWidgets
    entitlements:
      path: MoqomRoom/MoqomRoom.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: MoqomRoom/Info.plist
      properties:
        CFBundleDisplayName: MOQOM
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Publish your camera to the room.
        NSMicrophoneUsageDescription: Publish your microphone to the room.
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: cloud.moqom.room.invitation
            CFBundleURLSchemes:
              - moqom
        # Read by RelayConfiguration.swift. Empty relay host = in-memory loopback.
        MOQOMRelayHost: $(MOQOM_RELAY_HOST)
        MOQOMRelayPort: $(MOQOM_RELAY_PORT)
        MOQOMJoinHost: $(MOQOM_JOIN_HOST)
        MOQOMJoinPort: $(MOQOM_JOIN_PORT)
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  MoqomRoomWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MoqomRoomWidgets
    dependencies:
      - package: MoqomKit
        product: MoqomKit
    info:
      path: MoqomRoomWidgets/Info.plist
      properties:
        CFBundleDisplayName: MOQOM
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(MOQOM_BUNDLE_PREFIX).room.widgets

  MoqomRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MoqomRoomTests
    dependencies:
      - target: MoqomRoom
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: MoqomRoom
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(MOQOM_BUNDLE_PREFIX).room.tests

  MoqomRoomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MoqomRoomUITests
    dependencies:
      - target: MoqomRoom
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: MoqomRoom
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(MOQOM_BUNDLE_PREFIX).room.uitests
